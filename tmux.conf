# Minimal, subtle tmux config for presentation

# Status bar colors - very dark gray bg, muted light gray fg
set -g status-style 'bg=#1a1a1a,fg=#555555'

# Left side: window list only
set -g status-left ''
set -g status-left-length 0

# Right side: time only
set -g status-right '%H:%M'
set -g status-right-length 10

# Window status format - just the name
set -g window-status-format ' #W '
set -g window-status-current-format ' #W '

# Current window slightly brighter
set -g window-status-current-style 'fg=#888888'

# No separators
set -g window-status-separator ''

# Pane borders - subtle
set -g pane-border-style 'fg=#333333'
set -g pane-active-border-style 'fg=#444444'
